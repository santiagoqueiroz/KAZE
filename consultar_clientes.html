<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Consultar Clientes</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: 'Bahnschrift', sans-serif;
      padding: 20px;
      background-color: #faebd7;
      margin: 0;
      visibility: hidden;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      box-sizing: border-box;
    }

    h1 {
      text-align: center;
      margin-top: 0;
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      font-size: 15px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }

    th {
      background-color: #eee;
    }

    #voltar {
      display: inline-block;
      background-color: #915c83;
      color: white;
      padding: 12px 20px;
      text-decoration: none;
      border-radius: 8px;
      font-weight: bold;
      text-align: center;
    }

    #voltar:hover {
      background-color: #7a4b6e;
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }

      table {
        font-size: 14px;
        overflow-x: auto;
        display: block;
      }

      th, td {
        white-space: nowrap;
      }

      h1 {
        font-size: 20px;
      }

      #voltar {
        display: block;
        width: 100%;
        margin-top: 10px;
      }
    }
  </style>
</head>
<body>

  <a id="voltar" href="painel.html">← Voltar</a>
  
  <div class="container">
    <h1>Clientes Cadastrados</h1>

    <div id="busca-cliente"></div>

    <table id="tabelaClientes">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Telefone</th>
          <th>CPF/CNPJ</th>
          <th>Endereço</th>
          <th>Bairro</th>
          <th>Cidade</th>
          <th>E-mail</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <a id="voltar" href="painel.html">← Voltar</a>
  </div>

  <script type="module">
    import { app, auth, db } from "./firebase-config.js";
    import { mensagemErro } from "./erros.js";
    import { esc } from "./seguranca.js";
    import { caixaBuscaCliente } from "./busca-antiga.js";
    import { lembrarCliente, esquecerCliente } from "./busca-clientes.js";
    const nomesClientes = {}, clientesMostrados = {};
    import {
      getFirestore, collection, getDocs, query, orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import {
      getAuth, onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

 

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }

      document.body.style.visibility = 'visible';

      const tabela = document.querySelector("#tabelaClientes tbody");

      // A tabela mostra só o resultado da busca (ou os últimos pesquisados): não lê todos os clientes
      caixaBuscaCliente(document.getElementById("busca-cliente"), () => {}, { aoListar: (lista) => {
        tabela.innerHTML = "";
        lista.forEach((c) => {
          clientesMostrados[c.id] = c;
          nomesClientes[c.id] = c.nome || "(sem nome)";
          const linha = document.createElement("tr");
         linha.innerHTML = `
            <td>${esc(c.nome)}</td>
            <td>${esc(c.telefone)}</td>
            <td>${esc(c.cpfOuCnpj)}</td>
            <td>${esc(c.endereco)}</td>
            <td>${esc(c.bairro)}</td>
            <td>${esc(c.cidade)}</td>
            <td>${esc(c.email)}</td>
            <td></td>
          `;
          // Botões criados sem HTML, para o id nunca ser interpretado como código
          const acoes = linha.lastElementChild;
          const btnEditar = document.createElement("button");
          btnEditar.textContent = "Editar";
          btnEditar.addEventListener("click", () => editarCliente(c.id));
          const btnExcluir = document.createElement("button");
          btnExcluir.textContent = "Excluir";
          btnExcluir.addEventListener("click", () => excluirCliente(c.id));
          acoes.append(btnEditar, " ", btnExcluir);

          tabela.appendChild(linha);
        });
      } });
    });

    import { deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    window.excluirCliente = async function(id) {
      const nome = nomesClientes[id] || "este cliente";
      const ok = confirm(
        `Excluir o cliente "${nome}"?\n\n` +
        "O orçamento em aberto dele também será apagado. " +
        "Orçamentos já salvos continuam em Orçamentos Salvos.\n\n" +
        "Essa ação não pode ser desfeita."
      );
      if (!ok) return;
    
      try {
        await deleteDoc(doc(db, "clientes", id));
        esquecerCliente(id);
        alert("Cliente excluído.");
        location.reload(); // atualiza a tabela
      } catch (err) {
        console.error("Erro ao excluir:", err);
        alert("Não foi possível excluir o cliente. " + mensagemErro(err));
      }
    }
    
    window.editarCliente = function(id) {
      lembrarCliente(clientesMostrados[id]);
      window.location.href = `editar_cliente.html?id=${id}`;
    }

  </script>
  <script src="ambiente.js"></script>
</body>
</html>
