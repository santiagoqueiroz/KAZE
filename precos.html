<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Editar Preços no Firestore</title>
  <style>
    body { font-family: sans-serif; margin: 20px; background: #f5f5f5; }
    h2 { background: #333; color: #fff; padding: 10px; margin-top: 30px; }
    .grupo { margin-bottom: 20px; padding: 10px; background: #fff; border: 1px solid #ccc; }
    label { display: flex; justify-content: space-between; margin: 5px 0; }
    input[type="text"] { width: 100px; text-align: right; }
    button { margin-top: 20px; padding: 10px 20px; font-weight: bold; }
  </style>
</head>
<body>

<div id="conteudo" style="display:none;">
  <p><a href="painel.html">← Voltar ao painel</a></p>
  <h1>Editar Preços no Firestore</h1>
  <div class="grupo" id="grupo-regras">
    <h2>REGRAS DE PREÇO</h2>
    <label><span>Markup (multiplicador sobre o custo, ex.: 2,4)</span><input type="text" id="regra-markup" inputmode="decimal"></label>
    <label><span>Custo cartão (ex.: 0,879)</span><input type="text" id="regra-custo-cartao" inputmode="decimal"></label>
    <p style="font-size: 13px; color: #555;">Vale para os orçamentos calculados a partir de agora. Orçamentos já salvos não mudam.</p>
    <button onclick="salvarRegras()">💾 Salvar regras</button>
    <p id="regras-status"></p>
  </div>
  <div id="grupos"></div>
  <button onclick="salvar()">📂 Salvar alterações</button>
  <p id="status"></p>

  <hr>
  <h2>➕ Adicionar novo item</h2>
  <label>Categoria:
    <select id="nova-categoria">
      <option value="tecidos">tecidos</option>
      <option value="tecidos_bk">tecidos_bk</option>
      <option value="parametros">parametros</option>
      <option value="trilhos">trilhos</option>
      <option value="persianas">persianas</option>
    </select>
  </label><br>
  <label>Nome:
    <input type="text" id="novo-nome" placeholder="Ex: TECIDO NOVO">
  </label><br>
  <label>Valor:
    <input type="text" id="novo-valor" placeholder="Ex: 12,34" oninput="mascarar(this)">
  </label><br><br>
  <button onclick="adicionarNovo()">➕ Adicionar</button>
  <p id="novo-status"></p>

  <hr>
  <h2>🗑️ Excluir item existente</h2>
  <label>Categoria:
    <select id="del-categoria" onchange="atualizarListaExclusao()">
      <option value="">-- selecione --</option>
      <option value="tecidos">tecidos</option>
      <option value="tecidos_bk">tecidos_bk</option>
      <option value="parametros">parametros</option>
      <option value="trilhos">trilhos</option>
      <option value="persianas">persianas</option>
    </select>
  </label><br>
  <label>Item:
    <select id="del-item">
      <option value="">-- selecione uma categoria --</option>
    </select>
  </label><br><br>
  <button onclick="excluir()">❌ Confirmar exclusão</button>
  <p id="excluir-status"></p>
</div>

<script type="module">
  import { auth, db } from "./firebase-config.js";
  import { esc } from "./seguranca.js";
  import { mensagemErro } from "./erros.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import {
    doc, getDoc, getDocs, setDoc, updateDoc, addDoc, deleteDoc,
    collection, writeBatch, deleteField
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const categorias = ["tecidos", "tecidos_bk", "parametros", "trilhos"];
  const precos = {};

  // Mesmo login das outras páginas: sem usuário, volta para a tela de login
  onAuthStateChanged(auth, user => {
    if (!user) {
      window.location.href = "index.html";
      return;
    }
    document.getElementById("conteudo").style.display = "block";
    carregar().catch(err => {
      document.getElementById("status").innerText = "❌ Não foi possível carregar os preços. " + mensagemErro(err);
    });
    carregarRegras();
  });

  async function carregar() {
    const container = document.getElementById("grupos");
    container.innerHTML = "";
    for (const categoria of categorias) {
      const snapCat = await getDoc(doc(db, "precos", categoria));
      const dados = snapCat.data() || {};
      precos[categoria] = dados;
      const div = document.createElement("div");
      div.className = "grupo";
      div.innerHTML = `<h2>${esc(categoria.toUpperCase())}</h2>`;
      for (const [nome, valor] of Object.entries(dados).sort((a, b) => a[0].localeCompare(b[0]))) {
        const v = (Number(valor) || 0).toFixed(2).replace('.', ',');
        div.innerHTML += `<label><span>${esc(nome)}</span><input type="text" value="${esc(v)}" data-cat="${esc(categoria)}" data-nome="${esc(nome)}" oninput="mascarar(this)"></label>`;
      }
      container.appendChild(div);
    }
    
    const snap = await getDocs(collection(db, "persianas"));
    precos.persianas = {};
    const divP = document.createElement("div");
    divP.className = "grupo";
    divP.innerHTML = `<h2>PERSIANAS</h2>`;
   const docs = [];
snap.forEach(d => docs.push({ id: d.id, ...d.data() }));
docs.sort((a, b) => (a.nome || "").localeCompare(b.nome || "", 'pt-BR'));

for (const { id, nome, preco } of docs) {
  precos.persianas[id] = { nome, preco };
  const v = (preco || 0).toFixed(2).replace('.', ',');
  divP.innerHTML += `<label><span>${esc(nome)}</span><input type="text" data-cat="persianas" data-id="${esc(id)}" value="${esc(v)}" oninput="mascarar(this)"></label>`;
}

container.appendChild(divP);
  }

  // Regras de preço (precos/regras): markup e custo cartão
  const REGRAS_PADRAO = { markup: 2.4, custoCartao: 0.879 };
  const paraTexto = (n) => String(n).replace('.', ',');
  const paraNumero = (t) => parseFloat(String(t).trim().replace(',', '.'));

  async function carregarRegras() {
    let dados = {};
    try {
      const snap = await getDoc(doc(db, "precos", "regras"));
      if (snap.exists()) dados = snap.data();
    } catch (err) {
      document.getElementById("regras-status").innerText = "⚠️ Não foi possível carregar as regras. " + mensagemErro(err);
    }
    document.getElementById("regra-markup").value = paraTexto(dados.markup ?? REGRAS_PADRAO.markup);
    document.getElementById("regra-custo-cartao").value = paraTexto(dados.custoCartao ?? REGRAS_PADRAO.custoCartao);
  }

  async function salvarRegras() {
    const status = document.getElementById("regras-status");
    const markup = paraNumero(document.getElementById("regra-markup").value);
    const custoCartao = paraNumero(document.getElementById("regra-custo-cartao").value);
    if (!(markup >= 1 && markup <= 10)) {
      status.innerText = "❌ Markup deve ser um número entre 1 e 10.";
      return;
    }
    if (!(custoCartao >= 0.5 && custoCartao <= 1)) {
      status.innerText = "❌ Custo cartão deve ser um número entre 0,5 e 1 (ex.: 0,879).";
      return;
    }
    if (!confirm(`Salvar markup ${paraTexto(markup)} e custo cartão ${paraTexto(custoCartao)}?`)) return;
    try {
      await setDoc(doc(db, "precos", "regras"), { markup, custoCartao });
      status.innerText = "✅ Regras salvas.";
    } catch (err) {
      status.innerText = "❌ Erro ao salvar as regras. " + mensagemErro(err);
    }
  }

  function mascarar(campo) {
    let v = campo.value.replace(/\D/g, '');
    v = (parseFloat(v) / 100).toFixed(2);
    campo.value = v.replace('.', ',');
  }

  async function salvar() {
    const inputs = document.querySelectorAll("input[data-cat]");
    const persianasUpdates = [];
    for (const input of inputs) {
      const cat = input.dataset.cat;
      if (cat === "persianas") {
        const id = input.dataset.id;
        const preco = parseFloat(input.value.replace(',', '.')) || 0;
        persianasUpdates.push({ id, preco });
        if (precos.persianas[id]) precos.persianas[id].preco = preco;
      } else {
        const nome = input.dataset.nome;
        const valor = parseFloat(input.value.replace(',', '.')) || 0;
        precos[cat][nome] = valor;
      }
    }
    try {
      // Grava tudo em um único lote: ou salva todas as tabelas, ou nenhuma
      const lote = writeBatch(db);
      for (const cat of categorias) {
        lote.set(doc(db, "precos", cat), precos[cat]);
      }
      for (const { id, preco } of persianasUpdates) {
        lote.update(doc(db, "persianas", id), { preco });
      }
      await lote.commit();
      document.getElementById("status").innerText = "✅ Alterações salvas com sucesso.";
    } catch (err) {
      document.getElementById("status").innerText = "❌ Erro ao salvar. " + mensagemErro(err);
    }
  }

  async function adicionarNovo() {
    const cat = document.getElementById("nova-categoria").value;
    const nome = document.getElementById("novo-nome").value.trim().toUpperCase();
    const valorStr = document.getElementById("novo-valor").value.replace(',', '.');
    const valor = parseFloat(valorStr);
    if (!nome || isNaN(valor)) {
      document.getElementById("novo-status").innerText = "❌ Preencha nome e valor corretamente.";
      return;
    }
    try {
      if (cat === "persianas") {
        await addDoc(collection(db, "persianas"), { nome, preco: valor });
      } else {
        await updateDoc(doc(db, "precos", cat), { [nome]: valor });
      }
      document.getElementById("novo-status").innerText = "✅ Item adicionado!";
      carregar();
      document.getElementById("novo-nome").value = "";
      document.getElementById("novo-valor").value = "";
    } catch (err) {
      document.getElementById("novo-status").innerText = "❌ Erro ao adicionar. " + mensagemErro(err);
    }
  }

  function atualizarListaExclusao() {
    const cat = document.getElementById("del-categoria").value;
    const select = document.getElementById("del-item");
    select.innerHTML = "";
    if (!cat || !precos[cat]) {
      select.innerHTML = `<option value="">-- selecione uma categoria --</option>`;
      return;
    }
   if (cat === "persianas") {
      for (const [id, dados] of Object.entries(precos.persianas).sort((a, b) => (a[1].nome || "").localeCompare(b[1].nome || ""))) {
        const opt = document.createElement("option");
        opt.value = id;
        opt.innerText = dados.nome;
        select.appendChild(opt);
      }
    } else {
      for (const nome of Object.keys(precos[cat])) {
        const opt = document.createElement("option");
        opt.value = nome;
        opt.innerText = nome;
        select.appendChild(opt);
      }
    }
  }

  async function excluir() {
    const cat = document.getElementById("del-categoria").value;
    const valor = document.getElementById("del-item").value;
    if (!cat || !valor) {
      document.getElementById("excluir-status").innerText = "❌ Selecione a categoria e o item.";
      return;
    }
    const nome = cat === "persianas" && precos.persianas[valor] ? precos.persianas[valor].nome : valor;
    if (!confirm(`Tem certeza que deseja excluir "${nome}" da categoria "${cat}"?`)) return;
    try {
      if (cat === "persianas") {
        await deleteDoc(doc(db, "persianas", valor));
      } else {
        await updateDoc(doc(db, "precos", cat), { [valor]: deleteField() });
      }
      document.getElementById("excluir-status").innerText = "✅ Item excluído.";
      carregar();
    } catch (err) {
      document.getElementById("excluir-status").innerText = "❌ Erro ao excluir. " + mensagemErro(err);
    }
  }

  // Funções chamadas pelos botões da página (onclick/oninput/onchange)
  Object.assign(window, { salvar, salvarRegras, adicionarNovo, atualizarListaExclusao, excluir, mascarar });
</script>
  <script src="ambiente.js"></script>
</body>
</html>
